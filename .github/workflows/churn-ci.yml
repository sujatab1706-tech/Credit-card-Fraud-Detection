name: Churn CI

on:
  push:
    paths: ["customer-churn-pred/**", ".github/workflows/churn-ci.yml"]
  pull_request:
    paths: ["customer-churn-pred/**", ".github/workflows/churn-ci.yml"]

defaults:
  run:
    working-directory: customer-churn-pred

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: customer-churn-pred/requirements.txt
      - run: pip install -r requirements.txt
      - name: Unit and API tests
        run: pytest -q
      - name: Retrain end to end and check the model still beats the bar
        run: |
          python src/generate_data.py --out data/telco_churn.csv
          cd src && python train.py --data ../data/telco_churn.csv --out ../results --models ../ci_models
          python -c "import json; m=json.load(open('../ci_models/model_meta.json'))['test']; print(m); assert m['roc_auc'] > 0.80, 'ROC-AUC dropped below 0.80'"

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t churn-api .
      - name: Smoke test the container
        run: |
          docker run -d -p 8000:8000 --name api churn-api
          for i in $(seq 1 20); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf localhost:8000/health
