name: Cash Application CI

on:
  push:
    paths: ["cash-application/**", ".github/workflows/cash-app-ci.yml"]
  pull_request:
    paths: ["cash-application/**", ".github/workflows/cash-app-ci.yml"]

defaults:
  run:
    working-directory: cash-application

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cash-application/requirements.txt
      - run: pip install -r requirements.txt
      - name: Unit, matching and API tests
        run: pytest -q
      - name: Regenerate data, retrain, and check the matcher still clears the bar
        run: |
          python src/generate_data.py --out data
          python src/train.py --data data --models ci_models --results ci_results
          python -c "
          import json
          t = json.load(open('ci_models/model_meta.json'))['test']
          print(t)
          assert t['auto_match_rate'] > 0.75, 'auto-match rate dropped below 75%'
          assert t['auto_match_precision'] >= 0.99, 'auto-match precision dropped below 99%'
          "

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t cash-app-api .
      - name: Smoke test the container
        run: |
          docker run -d -p 8000:8000 --name api cash-app-api
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf -X POST localhost:8000/match -H 'Content-Type: application/json' \
            -d '{"payment_id":"smoke","payment_date":"2025-11-03","amount":100,"payer_name":"TEST","remittance_text":""}'
